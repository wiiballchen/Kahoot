services:
  - type: web
    name: kahoot-party-quiz
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: kahoot-party-data
      mountPath: /var/data
      sizeGB: 1
